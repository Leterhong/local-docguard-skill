<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr-arch" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F883D"/>
    </marker>
    <style>
      .title{font-size:22px;font-weight:700;fill:#1F2328}
      .col{font-size:15px;font-weight:700;fill:#1F883D}
      .box{fill:#F6F8FA;stroke:#D0D7DE;stroke-width:1.5}
      .boxg{fill:#EAF4EC;stroke:#1F883D;stroke-width:1.5}
      .lbl{font-size:13px;font-weight:600;fill:#1F2328}
      .sub{font-size:11px;fill:#57606A}
      .hl{font-size:13px;font-weight:700;fill:#1F883D}
      .bantxt{font-size:14px;font-weight:700;fill:#FFFFFF}
      .banitem{font-size:12px;fill:#C9D1D9}
    </style>
  </defs>
  <rect width="1000" height="700" fill="#FFFFFF"/>

  <text x="40" y="42" class="title">图 1　DocGuard AI 系统架构 — Agent 工具 → Skill → 本地服务层</text>
  <line x1="40" y1="58" x2="960" y2="58" stroke="#D0D7DE"/>

  <!-- Column headers -->
  <text x="60" y="92" class="col">① 生产力级 Agent</text>
  <text x="360" y="92" class="col">② DocGuard Skill 入口</text>
  <text x="680" y="92" class="col">③ 本地服务层（127.0.0.1）</text>

  <!-- ① Agent Host -->
  <g>
    <rect x="60" y="115" width="220" height="52" rx="8" class="box"/>
    <text x="80" y="138" class="lbl">Qoder</text>
    <text x="80" y="156" class="sub">AI 编程与 Agent IDE</text>

    <rect x="60" y="180" width="220" height="52" rx="8" class="box"/>
    <text x="80" y="203" class="lbl">WorkBuddy</text>
    <text x="80" y="221" class="sub">生产力级 AI 助手（基线）</text>

    <rect x="60" y="245" width="220" height="52" rx="8" class="box"/>
    <text x="80" y="268" class="lbl">TRAE Work</text>
    <text x="80" y="286" class="sub">Agent 工作流平台</text>
  </g>

  <!-- ② Skill Entry -->
  <g>
    <rect x="340" y="115" width="260" height="44" rx="8" class="boxg"/>
    <text x="360" y="142" class="hl">SKILL.md（Agent 规范）</text>

    <rect x="340" y="172" width="260" height="40" rx="8" class="box"/>
    <text x="360" y="198" class="lbl">analyze_document · 文档审查</text>

    <rect x="340" y="222" width="260" height="40" rx="8" class="box"/>
    <text x="360" y="248" class="lbl">search_document · 知识问答</text>

    <rect x="340" y="272" width="260" height="40" rx="8" class="box"/>
    <text x="360" y="298" class="lbl">generate_report · 报告生成</text>

    <rect x="340" y="330" width="260" height="44" rx="8" class="boxg"/>
    <text x="360" y="357" class="hl">FastAPI 服务 127.0.0.1:8765</text>
  </g>

  <!-- ③ Local Server -->
  <g>
    <rect x="660" y="115" width="280" height="58" rx="8" class="box"/>
    <text x="680" y="140" class="lbl">解析与理解</text>
    <text x="680" y="160" class="sub">文档解析 · OCR（可选）</text>

    <rect x="660" y="188" width="280" height="58" rx="8" class="box"/>
    <text x="680" y="213" class="lbl">检索 RAG</text>
    <text x="680" y="233" class="sub">Embedding · FAISS 向量库</text>

    <rect x="660" y="261" width="280" height="74" rx="8" class="boxg"/>
    <text x="680" y="286" class="lbl">双引擎风险分析</text>
    <text x="680" y="306" class="sub">规则引擎（确定性·可独立）</text>
    <text x="680" y="322" class="sub">本地 LLM（OpenVINO · 增强）</text>

    <rect x="660" y="350" width="280" height="48" rx="8" class="box"/>
    <text x="680" y="374" class="lbl">报告生成</text>
    <text x="680" y="392" class="sub">Markdown / HTML / JSON</text>
  </g>

  <!-- Arrows -->
  <g stroke="#1F883D" stroke-width="2.5" marker-end="url(#arr-arch)">
    <line x1="280" y1="265" x2="338" y2="265"/>
    <line x1="600" y1="352" x2="658" y2="280"/>
  </g>
  <text x="288" y="258" class="sub">HTTP localhost</text>
  <text x="610" y="268" class="sub">127.0.0.1:8765</text>

  <!-- Bottom: local models -->
  <rect x="60" y="450" width="880" height="90" rx="10" class="boxg"/>
  <text x="84" y="480" class="hl">本地模型（OpenVINO™ IR · INT4）</text>
  <text x="84" y="506" class="sub">LLM：Qwen2.5-7B-Instruct-int4-ov（≤35B）·  Embedding：BGE-small-zh</text>
  <text x="84" y="526" class="sub">未启用本地模型时自动降级为「确定性规则引擎 + 哈希嵌入 + FAISS」，审查/检索/报告仍真实可用。</text>

  <!-- Bottom: security -->
  <rect x="60" y="560" width="880" height="110" rx="10" fill="#1F2328"/>
  <text x="84" y="592" class="bantxt">安全边界 · 企业敏感数据不出机</text>
  <text x="84" y="618" class="banitem">• 服务仅绑定 127.0.0.1，不上公网；模型、向量、文件全部在 localhost 运行</text>
  <text x="84" y="640" class="banitem">• 日志对手机号 / 身份证 / 邮箱 / 银行卡号自动脱敏</text>
  <text x="84" y="662" class="banitem">• 用户文件按 user_id 隔离；云端模型受 security.local_only 总闸强制约束</text>
</svg>
