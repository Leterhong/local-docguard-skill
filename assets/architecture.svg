<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F883D"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#EA4335"/>
    </marker>
    <style>
      .title{font-size:22px;font-weight:700;fill:#1F2328}
      .col{font-size:15px;font-weight:700;fill:#1F883D}
      .box{fill:#F6F8FA;stroke:#D0D7DE;stroke-width:1.5}
      .boxg{fill:#EAF4EC;stroke:#1F883D;stroke-width:1.5}
      .boxt{fill:#EAF4EC;stroke:#1F883D;stroke-width:1.5;stroke-dasharray:5 4}
      .boxr{fill:#FCE8E6;stroke:#EA4335;stroke-width:2}
      .lbl{font-size:13px;font-weight:600;fill:#1F2328}
      .sub{font-size:11px;fill:#57606A}
      .hl{font-size:13px;font-weight:700;fill:#1F883D}
      .hlr{font-size:13px;font-weight:700;fill:#EA4335}
      .bantxt{font-size:14px;font-weight:700;fill:#FFFFFF}
      .banitem{font-size:12px;fill:#C9D1D9}
      .note{font-size:11px;fill:#57606A;font-style:italic}
    </style>
  </defs>
  <rect width="1000" height="700" fill="#FFFFFF"/>

  <text x="40" y="42" class="title">图 1　DocGuard AI 系统架构 — Agent 宿主 ⇄ Skill(6 工具) ⇄ 本地服务 + ReAct 编排</text>
  <line x1="40" y1="58" x2="960" y2="58" stroke="#D0D7DE"/>

  <!-- ① 宿主 Agent -->
  <text x="60" y="90" class="col">① 生产力级 Agent 宿主</text>
  <rect x="60" y="105" width="230" height="46" rx="8" class="box"/>
  <text x="76" y="128" class="lbl">Qoder</text><text x="76" y="144" class="sub">AI 编程与 Agent IDE</text>
  <rect x="60" y="160" width="230" height="46" rx="8" class="box"/>
  <text x="76" y="183" class="lbl">WorkBuddy</text><text x="76" y="199" class="sub">生产力级 AI 助手（基线）</text>
  <rect x="60" y="215" width="230" height="46" rx="8" class="box"/>
  <text x="76" y="238" class="lbl">TRAE Work</text><text x="76" y="254" class="sub">Agent 工作流平台</text>
  <rect x="60" y="270" width="230" height="40" rx="8" class="boxt"/>
  <text x="76" y="295" class="lbl">其它 Skills（外部）</text>
  <text x="300" y="200" class="note" transform="rotate(-90 300 200)">⇄ 双向互操作</text>

  <!-- ② Skill 入口 -->
  <text x="330" y="90" class="col">② DocGuard Skill 入口</text>
  <rect x="330" y="105" width="320" height="40" rx="8" class="boxg"/>
  <text x="346" y="130" class="hl">SKILL.md · 定义 6 个 Tool</text>
  <rect x="330" y="151" width="320" height="34" rx="8" class="box"/>
  <text x="346" y="173" class="lbl">run.ps1 · 统一宿主入口（Host 固定）</text>
  <rect x="330" y="193" width="155" height="42" rx="7" class="box"/><text x="344" y="214" class="lbl">analyze 文档审查</text>
  <rect x="495" y="193" width="155" height="42" rx="7" class="box"/><text x="509" y="214" class="lbl">search 知识问答</text>
  <rect x="330" y="241" width="155" height="42" rx="7" class="box"/><text x="344" y="262" class="lbl">report 报告生成</text>
  <rect x="495" y="241" width="155" height="42" rx="7" class="box"/><text x="509" y="262" class="lbl">bid 投标自检</text>
  <rect x="330" y="289" width="155" height="42" rx="7" class="box"/><text x="344" y="310" class="lbl">compare 文档对比</text>
  <rect x="495" y="289" width="155" height="42" rx="7" class="boxr"/><text x="509" y="304" class="hlr">agent 自主编排</text><text x="509" y="320" class="sub">Agentic</text>
  <rect x="330" y="340" width="320" height="40" rx="8" class="boxg"/>
  <text x="346" y="365" class="hl">HTTP API · 127.0.0.1:8765</text>
  <text x="330" y="398" class="note">⇄ 可被其它 Skill 调用 / 调用其它 Skill</text>

  <!-- ③ 本地服务 -->
  <text x="690" y="90" class="col">③ 本地服务层（FastAPI）</text>
  <rect x="690" y="105" width="250" height="320" rx="10" class="boxg"/>
  <rect x="702" y="114" width="226" height="36" rx="7" class="box"/><text x="716" y="136" class="lbl">解析 / OCR</text>
  <rect x="702" y="156" width="226" height="36" rx="7" class="box"/><text x="716" y="178" class="lbl">Embedding + FAISS</text>
  <rect x="702" y="198" width="226" height="52" rx="7" class="boxr"/><text x="716" y="218" class="hlr">★ ReAct Orchestrator</text><text x="716" y="236" class="sub">自主多步规划·循环调用工具</text>
  <rect x="702" y="256" width="226" height="36" rx="7" class="box"/><text x="716" y="278" class="lbl">规则引擎（兜底）</text>
  <rect x="702" y="298" width="226" height="36" rx="7" class="box"/><text x="716" y="320" class="lbl">本地 LLM（OpenVINO）</text>
  <rect x="702" y="340" width="226" height="36" rx="7" class="box"/><text x="716" y="362" class="lbl">报告生成</text>
  <rect x="702" y="382" width="226" height="36" rx="7" class="boxt"/><text x="716" y="404" class="lbl">可选端云协同（默认关闭）</text>

  <!-- 主调用箭头 -->
  <g stroke="#1F883D" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="290" y1="200" x2="328" y2="200"/>
    <line x1="650" y1="360" x2="688" y2="200"/>
  </g>
  <text x="296" y="194" class="sub">HTTP localhost</text>
  <text x="556" y="360" class="sub">tools → POST API</text>
  <!-- Orchestrator 回环调度（虚线橙） -->
  <g stroke="#EA4335" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-o)">
    <line x1="702" y1="224" x2="650" y2="318"/>
  </g>
  <text x="600" y="262" class="note">调度工具</text>

  <!-- 底部：本地模型 -->
  <rect x="60" y="450" width="880" height="80" rx="10" class="boxg"/>
  <text x="84" y="478" class="hl">本地模型（OpenVINO™ IR · INT4 · 支持 Intel NPU / GPU / CPU · device: AUTO 自动调度）</text>
  <text x="84" y="502" class="sub">LLM：你配置的本地模型（示例 Qwen2.5-7B-Instruct-int4-ov，≤35B）·  Embedding：BGE-small-zh</text>
  <text x="84" y="522" class="sub">未启用本地模型时自动降级为「确定性规则引擎 + 哈希嵌入 + FAISS」，审查 / 检索 / 报告仍真实可用。</text>

  <!-- 底部：安全 -->
  <rect x="60" y="545" width="880" height="120" rx="10" fill="#1F2328"/>
  <text x="84" y="577" class="bantxt">安全边界 · 企业敏感数据不出机</text>
  <text x="84" y="603" class="banitem">• 服务仅绑定 127.0.0.1，不上公网；模型、向量、文件全部在 localhost 运行</text>
  <text x="84" y="625" class="banitem">• 日志对手机号 / 身份证 / 邮箱 / 银行卡号自动脱敏；用户文件按 user_id 隔离</text>
  <text x="84" y="647" class="banitem">• 云端增强受 security.local_only 总闸强制约束：默认 true（纯本地）；设为 false + cloud.enabled 才可选开启，原文件字节永不出机</text>
</svg>
